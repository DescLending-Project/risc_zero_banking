[package]
name = "host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "host"
path = "src/main.rs"

[[bin]]
name = "extract_image_id"
path = "src/extract_imageId.rs"

[dependencies]
nesting_methods = { path = "../methods" }
risc0-zkvm = { version = "2.1.0", features = ["client"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
bincode = "1.3"
anyhow = "1.0"
hex = "0.4.3"
ethereum-types = "0.14"
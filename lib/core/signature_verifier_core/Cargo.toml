[package]
name = "signature_verifier_core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
hex = { version = "0.4", default-features = false  ,features = ["alloc"]}
# k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "sha256"] }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves" }
risc0-zkvm = { version = "2.1.0", default-features = false, features = ["std", "unstable"] }
risc0-build = { version = "2.1.0" , features = ["unstable"] }
sha3 = { version = "0.10", default-features = false }
ethereum-types = { version = "0.14", default-features = false }

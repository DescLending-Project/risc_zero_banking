[package]
name = "signature_verifier_core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
risc0-zkvm = { version = "0.21" }
hex = { version = "0.4", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "sha256"] }
sha3 = { version = "0.10", default-features = false }
ethereum-types = { version = "0.14", default-features = false }

[package]
name = "score_calculation"
version = "0.1.0"
edition = "2021"
description = "FICO-inspired credit scoring system for decentralized finance"

[dependencies]
# Serialization support for RISC Zero
serde = { version = "1.0", features = ["derive"] }


[dev-dependencies]
# For testing
serde_json = "1.0"

[lib]
name = "score_calculation"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["serde/std"]
